name: Publicar Infinity Flow Web no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: infinity-flow-github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verificar habilitação do GitHub Pages
        id: disponibilidade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::GitHub Pages ainda não habilitado. O build web será entregue como artefato. Para publicar neste domínio, escolha GitHub Actions em Settings > Pages.'
            echo 'O build web está disponível no artefato Infinity-Flow-Web. GitHub Pages precisa ser habilitado em Settings > Pages para publicação automática.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.disponibilidade.outputs.enabled == 'true'
        id: pages
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Validar jogo
        run: npm test
      - name: Compilar para o caminho do GitHub Pages
        env:
          CONFIGURED_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          base_path="${CONFIGURED_BASE:-/${GITHUB_REPOSITORY#*/}}"
          npm run build -- --base "$base_path/"
      - name: Disponibilizar versão web
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Flow-Web
          path: dist
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: steps.disponibilidade.outputs.enabled == 'true'
        with:
          path: dist
      - name: Publicar site
        id: publicacao
        if: steps.disponibilidade.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
