name: Publicar Infinity Flow Web no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: infinity-flow-github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Validar jogo
        run: npm test
      - name: Compilar para o caminho do GitHub Pages
        run: npm run build -- --base '${{ steps.pages.outputs.base_path }}/'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar site
        id: publicacao
        uses: actions/deploy-pages@v4
