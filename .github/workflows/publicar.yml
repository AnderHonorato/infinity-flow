name: Publicar Infinity Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-flow-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar combate, progresso e persistência
        run: npm test
      - name: Compilar interface
        run: npm run build

  apk:
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK do runner Ubuntu
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/platform-tools" "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null < <(yes)
          "$sdkmanager" --sdk_root="$sdk_root" --install 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0' 'platform-tools'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          npm run android:build
      - name: Verificar assinatura e empacotamento
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/infinity-flow.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/infinity-flow.apk > artifacts/android-package.txt
          cd artifacts
          sha256sum infinity-flow.apk > infinity-flow.apk.sha256
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Flow-APK
          path: |
            artifacts/infinity-flow.apk
            artifacts/infinity-flow.apk.sha256
            artifacts/android-package.txt
          if-no-files-found: error
